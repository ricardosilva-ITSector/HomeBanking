name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src/api

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./src/api

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        working-directory: .

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/test-results.trx'

  frontend-build-and-test:
    name: Frontend Build, Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './src/web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/web

      - name: Lint
        run: npm run lint
        working-directory: ./src/web

      - name: Run unit tests
        run: npm run test -- --run
        working-directory: ./src/web

      - name: Build
        run: npm run build
        working-directory: ./src/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./src/web/dist

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './src/web/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./src/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./src/web

      - name: Build backend
        run: dotnet build --configuration Release
        working-directory: ./src/api

      - name: Start backend API
        run: |
          cd src/api
          dotnet run --configuration Release --no-build &
          echo "Waiting for API to start..."
          timeout 30 bash -c 'until curl -f http://localhost:5000/health; do sleep 1; done' || exit 1
        env:
          ASPNETCORE_URLS: http://localhost:5000

      - name: Start frontend dev server
        run: |
          cd src/web
          npm run dev &
          echo "Waiting for frontend to start..."
          timeout 30 bash -c 'until curl -f http://localhost:5173; do sleep 1; done' || exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./src/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./src/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: ./src/web/test-results/
          retention-days: 7
